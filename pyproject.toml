[project]
name = "apple-music-sync"
version = "2.0.0"
description = "Export Apple Music library to Android with beautiful TUI"
authors = [{name = "Dvitto", email = "dvitto@example.com"}]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "textual>=0.47.0",
    "typer>=0.12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "platformdirs>=4.1.0",
    "rich>=13.7.0",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
]

[project.scripts]
apple-music-sync = "apple_music_sync.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
